[project]
name = "gdrive-to-docmost-converter"
version = "0.1.0"
description = "Convert Google Docs from Google Drive to Docmost pages"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.0",
    "google-api-python-client>=2.190.0",
    "google-auth-oauthlib>=1.2.2",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.8.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdrive_to_docmost_converter"]

[tool.pytest.ini_options]
markers = ["integration: hits the local Docmost instance (requires docker)"]
addopts = "-m 'not integration'"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
