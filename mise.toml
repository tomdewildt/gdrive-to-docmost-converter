[tools]
python = "3.13"
uv = "0.10.5"

[tasks.init]
description = "Initialize the environment"
run = "uv sync"

[tasks.start]
description = "Run the CLI"
run = "uv run python -m gdrive_to_docmost_converter.cli"

[tasks."docmost:start"]
description = "Start the docmost server"
run = "docker compose up -d"

[tasks."docmost:logs"]
description = "Show the docmost server logs"
run = "docker compose logs -f"

[tasks."docmost:stop"]
description = "Stop the docmost server"
run = "docker compose down"

[tasks."infra:init"]
description = "Initialize the infrastructure environment"
run = "terraform -chdir=infra init -upgrade"

[tasks."infra:bootstrap"]
description = "Bootstrap the infrastructure environment"
run = """
set -eu
trap 'rm -f infra/backend_override.tf' EXIT
echo 'terraform {
  backend "local" {}
}' > infra/backend_override.tf
terraform -chdir=infra init
terraform -chdir=infra apply -target=google_storage_bucket.state
rm infra/backend_override.tf
terraform -chdir=infra init -migrate-state
rm -f infra/terraform.tfstate infra/terraform.tfstate.backup
"""

[tasks."infra:provision"]
description = "Provision the google cloud project"
run = "terraform -chdir=infra apply"

[tasks.lint]
description = "Run lint check"
run = "uv run ruff check src/ test/"

[tasks.format]
description = "Run format check"
run = "uv run ruff format --check src/ test/"

[tasks.types]
description = "Run type check"
run = "uv run pyright src/"

[tasks.test]
description = "Run all tests"
run = "uv run pytest -m '' test/"

[tasks."test:unit"]
description = "Run unit tests"
run = "uv run pytest test/"

[tasks."test:integration"]
description = "Run integration tests"
run = "uv run pytest -m integration test/"
